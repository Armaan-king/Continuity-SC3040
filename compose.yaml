services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuze
      POSTGRES_USER: fuze
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fuze-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuze -d fuze"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://fuze:local-development-only@database:5432/fuze
      FUZE_ENV: development
      FUZE_LLM_PROVIDER: ${FUZE_LLM_PROVIDER-${CONTINUITY_LLM_PROVIDER:-disabled}}
      FUZE_LLM_API_KEY: ${FUZE_LLM_API_KEY-${CONTINUITY_LLM_API_KEY:-}}
      FUZE_LLM_BASE_URL: ${FUZE_LLM_BASE_URL-${CONTINUITY_LLM_BASE_URL:-}}
      FUZE_LLM_MODEL: ${FUZE_LLM_MODEL-${CONTINUITY_LLM_MODEL:-}}
      FUZE_LLM_MAX_TOKENS: ${FUZE_LLM_MAX_TOKENS-${CONTINUITY_LLM_MAX_TOKENS:-4096}}
      FUZE_LLM_MAX_CALLS: ${FUZE_LLM_MAX_CALLS-${CONTINUITY_LLM_MAX_CALLS:-40}}
      FUZE_LLM_TOKEN_BUDGET: ${FUZE_LLM_TOKEN_BUDGET-${CONTINUITY_LLM_TOKEN_BUDGET:-120000}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FUZE_RESEARCH_ENABLED: ${FUZE_RESEARCH_ENABLED-${CONTINUITY_RESEARCH_ENABLED:-1}}
      FUZE_RESEARCH_MAX_CALLS: ${FUZE_RESEARCH_MAX_CALLS-${CONTINUITY_RESEARCH_MAX_CALLS:-6}}
      FUZE_RESEARCH_BUDGET_USD: ${FUZE_RESEARCH_BUDGET_USD-${CONTINUITY_RESEARCH_BUDGET_USD:-0.12}}
    depends_on:
      database:
        condition: service_healthy
volumes:
  fuze-data:
