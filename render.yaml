# One public origin avoids cross-site session cookies and frontend API URL rebuilds.
# Create a Neon Free database and supply its direct connection URL below.
services:
  - type: web
    name: continuity-sc3040
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: CONTINUITY_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CONTINUITY_COOKIE_SECURE
        value: "1"
      - key: CONTINUITY_COOKIE_SAMESITE
        value: lax
      - key: CONTINUITY_LLM_PROVIDER
        value: auto
      - key: CONTINUITY_MAX_ACTIVE_RUNS
        value: "2"
      - key: CONTINUITY_RUN_TIMEOUT_SECONDS
        value: "600"
      - key: CONTINUITY_RESEARCH_MAX_CALLS
        value: "6"
      - key: CONTINUITY_RESEARCH_BUDGET_USD
        value: "0.12"
# Optional server secrets, added through Render's Environment panel:
# GROQ_API_KEY or GEMINI_API_KEY; EXA_API_KEY enables optional research.
# Never prefix a secret with VITE_.
# No key is required for the explicitly labelled basic planning mode.
