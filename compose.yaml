services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: continuity
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - continuity-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuity -d continuity"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://continuity:local-development-only@database:5432/continuity
      CONTINUITY_ENV: development
      CONTINUITY_LLM_PROVIDER: ${CONTINUITY_LLM_PROVIDER:-disabled}
      CONTINUITY_LLM_API_KEY: ${CONTINUITY_LLM_API_KEY:-}
      CONTINUITY_LLM_BASE_URL: ${CONTINUITY_LLM_BASE_URL:-}
      CONTINUITY_LLM_MODEL: ${CONTINUITY_LLM_MODEL:-}
      CONTINUITY_LLM_MAX_TOKENS: ${CONTINUITY_LLM_MAX_TOKENS:-4096}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CONTINUITY_RESEARCH_ENABLED: ${CONTINUITY_RESEARCH_ENABLED:-1}
      CONTINUITY_RESEARCH_MAX_CALLS: ${CONTINUITY_RESEARCH_MAX_CALLS:-6}
      CONTINUITY_RESEARCH_BUDGET_USD: ${CONTINUITY_RESEARCH_BUDGET_USD:-0.12}
    depends_on:
      database:
        condition: service_healthy
volumes:
  continuity-data:
