# One public origin avoids cross-site session cookies and frontend API URL rebuilds.
# Create a Neon Free database and supply its direct connection URL below.
services:
  - type: web
    name: fuze-sc3040
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: FUZE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FUZE_COOKIE_SECURE
        value: "1"
      - key: FUZE_COOKIE_SAMESITE
        value: lax
      - key: FUZE_LLM_PROVIDER
        value: groq
      - key: FUZE_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: FUZE_LLM_MAX_TOKENS
        value: "4096"
      - key: GROQ_API_KEY
        sync: false
      - key: FUZE_MAX_ACTIVE_RUNS
        value: "2"
      - key: FUZE_RUN_TIMEOUT_SECONDS
        value: "600"
      - key: FUZE_RESEARCH_MAX_CALLS
        value: "6"
      - key: FUZE_RESEARCH_BUDGET_USD
        value: "0.12"
# GROQ_API_KEY is supplied privately through Render's Environment panel.
# Optional server secrets: GEMINI_API_KEY for Gemini; EXA_API_KEY for research.
# For Gemini, set FUZE_LLM_PROVIDER=gemini. Its default is gemini-3.8-flash.
# Existing FUZE_LLM_MODEL / FUZE_LLM_BASE_URL values override defaults;
# remove stale overrides or update them as described in docs/DEPLOYMENT.md.
# Never prefix a secret with VITE_.
# No key is required for the explicitly labelled basic planning mode.
